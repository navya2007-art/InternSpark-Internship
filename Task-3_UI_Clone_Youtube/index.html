<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouTube Clone</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f9f9f9;
    }

    .video-card img {
      width: 100%;
      border-radius: 10px;
    }

    .video-card {
      margin-bottom: 20px;
    }

    .navbar {
      padding: 15px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container-fluid">
    <h3>YouTube</h3>

    <input class="form-control w-50" type="search" placeholder="Search">
  </div>
</nav>

<div class="container mt-4">
  <div class="row">

    <div class="col-md-4 video-card">
      <img src="https://picsum.photos/400/250" alt="">
      <h5 class="mt-2">Sample Video Title</h5>
      <p>Channel Name</p>
    </div>

    <div class="col-md-4 video-card">
      <img src="https://picsum.photos/401/250" alt="">
      <h5 class="mt-2">Sample Video Title</h5>
      <p>Channel Name</p>
    </div>

    <div class="col-md-4 video-card">
      <img src="https://picsum.photos/402/250" alt="">
      <h5 class="mt-2">Sample Video Title</h5>
      <p>Channel Name</p>
    </div>

  </div>
</div>

</body>
</html>
